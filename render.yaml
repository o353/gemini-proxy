services:
  - type: web
    name: gemini-jinator-proxy
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: PROXY_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3-flash-preview
